name: Label PR's

on:
  pull_request_target:
    # synchronize matters because "Label PR" is a required status check: without
    # it the job never runs for a pushed commit, so the check stays unreported
    # and the pull request cannot be merged.
    types: [opened, edited, synchronize]

jobs:
  label:
    name: Label PR
    runs-on: ubuntu-latest
    steps:
      - uses: bcoe/conventional-release-labels@v1
        with:
          type_labels: |
            {
              "feat": "feature",
              "fix": "fix",
              "breaking": "breaking",
              "docs": "documentation",
              "perf": "performance",
              "revert": "revert"
            }
          ignored_types: |
            [
              "style",
              "refactor",
              "test",
              "chore"
            ]
