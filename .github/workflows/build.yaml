name: Builds

on: push

# Job names are required status checks on main, so renaming one means updating
# the branch protection rule to match.
#
# The job ids, artifact names and tarball names stay in darwin/linux terms:
# release.yaml uploads the same artifact names, and the Homebrew tap builds its
# download urls as dotty-$VERSION-$PLATFORM-$ARCHITECTURE.tar.gz.
jobs:
  build-darwin-arm64:
    name: Test macOS arm64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          rustup show
      # Testing and building the same target reuses one set of compiled
      # dependencies. Splitting them across jobs, or leaving the target off the
      # test command, builds vendored OpenSSL and libgit2 twice over.
      - name: Test
        run: |
          cargo test --locked --target aarch64-apple-darwin
      - name: Build
        run: |
          cargo build --locked --target aarch64-apple-darwin
      - name: Tar
        run: |
          cd target/aarch64-apple-darwin/debug
          tar -czvf dotty-darwin-arm64.tar.gz dotty
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: build-darwin-arm64
          path: target/aarch64-apple-darwin/debug/dotty-darwin-arm64.tar.gz

  build-darwin-amd64:
    name: Test macOS amd64
    # An Intel runner, so this builds and tests x86_64 natively rather than
    # cross compiling it from arm64 and leaving it untested.
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          rustup show
      - name: Test
        run: |
          cargo test --locked --target x86_64-apple-darwin
      - name: Build
        run: |
          cargo build --locked --target x86_64-apple-darwin
      - name: Tar
        run: |
          cd target/x86_64-apple-darwin/debug
          tar -czvf dotty-darwin-amd64.tar.gz dotty
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: build-darwin-amd64
          path: target/x86_64-apple-darwin/debug/dotty-darwin-amd64.tar.gz

  build-linux-amd64:
    name: Test Linux amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          rustup show
      - name: Test
        run: |
          cargo test --locked --target x86_64-unknown-linux-gnu
      - name: Build
        run: |
          cargo build --locked --target x86_64-unknown-linux-gnu
      - name: Tar
        run: |
          cd target/x86_64-unknown-linux-gnu/debug
          tar -czvf dotty-linux-amd64.tar.gz dotty
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-amd64
          path: target/x86_64-unknown-linux-gnu/debug/dotty-linux-amd64.tar.gz

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          rustup show
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
      - name: Formatting
        run: |
          cargo fmt --check
